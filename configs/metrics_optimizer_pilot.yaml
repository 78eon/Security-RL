# Phase 6B development-only protocol. Outcome/statistical definitions and the
# block_means_v2 thresholds remain identical to the preregistered amendment.
primary_metric: native_return

primary_metrics:
  - native_return
  - native_return_std
  - success_rate
  - steps_to_goal
  - mean_cvss_exploited

descriptive_metrics:
  - native_return_median
  - median_steps_to_goal
  - hvt_hit_rate
  - max_cvss_exploited
  - hosts_compromised
  - discovered_hosts
  - tactic_coverage
  - total_shaped_return

statistics:
  test: paired_t
  alpha: 0.05
  correction: bonferroni
  family_size: 5
  effect_size: cohens_d
  bootstrap_samples: 10000
  confidence: 0.95

evaluation:
  action_selection: stochastic
  reward_scale: native
  seeds: [33]
  episode_seeds: [911, 912, 913, 914, 915, 916, 917, 918, 919, 920]

convergence:
  method: block_means_v2
  window: 0.40
  min_episodes: 100
  blocks: 4
  return_scale_floor: 100.0
  max_block_mean_relative_range: 0.35
  max_abs_normalised_block_slope: 0.10
  max_half_window_change: 0.15

high_value_target:
  cvss_threshold: 9.0
