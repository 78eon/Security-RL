experiment:
  id: onprem-generalisation-v1
  description: Mask-aware PPO trained on hidden seeded on-prem topologies
  training_seed: 42
  # 196 complete 256-step PPO rollouts; no silent budget rounding.
  total_timesteps: 50176
  # One deterministic rollout per topology keeps topology as the sampling unit.
  evaluation_episode_seeds: [9001]
  deterministic_evaluation: true
  ppo:
    learning_rate: 0.0003
    n_steps: 256
    batch_size: 64
    n_epochs: 10
    gamma: 0.99
    gae_lambda: 0.95
    clip_range: 0.2
    ent_coef: 0.01
    vf_coef: 0.5
    max_grad_norm: 0.5
    policy_layers: [128, 128]
