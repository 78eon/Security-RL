services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rlredteam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rlredteam}
      POSTGRES_DB: ${POSTGRES_DB:-rlredteam}
    ports:
      # 5433 on the host to avoid clashing with a local 5432.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/rlredteam/storage/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rlredteam}"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-rlredteam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rlredteam}
      POSTGRES_DB: ${POSTGRES_DB:-rlredteam}
      PYTHONHASHSEED: "0"
    # No `user:` directive. Under rootless podman the host user is already
    # mapped to container root, so pinning user: 1000:1000 selects a DIFFERENT
    # identity that cannot write the bind-mounted runs/ directory. Under
    # rootful docker, add `user: "${UID}:${GID}"` to keep artefacts host-owned.
    volumes:
      # Live source, so `make test` and `make train` always run the current
      # code without a rebuild. The image also bakes a copy in at build time --
      # that baked copy is what makes the image standalone and reproducible;
      # this mount just shadows it during development.
      - ./src:/app/src:z
      - ./tests:/app/tests:z
      - ./scripts:/app/scripts:z
      - ./tools:/app/tools:z
      - ./configs:/app/configs:z
      - ./data:/app/data:z
      # Artefacts survive the container and stay host-owned.
      # runs/ is gitignored — trained weights are gated by default (charter §10).
      - ./runs:/app/runs:z

volumes:
  pgdata:
